[package]
name = "lumen"
version = "0.6.0"
description = "Lumen - Kubernetes cluster workbench"
authors = ["Lumen contributors"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix avoids a name clash with the bin target on Windows.
# See https://github.com/rust-lang/cargo/issues/8519
name = "lumen_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
kube = { version = "3.1", default-features = false, features = ["client", "rustls-tls", "ws", "runtime"] }
k8s-openapi = { version = "0.27", features = ["latest"] }
tokio-stream = "0.1"
tokio-util = { version = "0.7", features = ["rt", "io", "compat"] }
futures = "0.3"
dirs = "5"
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
serde_yaml = "0.9"
http = "1"
flate2 = "1"
base64 = "0.22"

[dev-dependencies]
wiremock = "0.6"
tokio = { version = "1", features = ["macros", "rt"] }
